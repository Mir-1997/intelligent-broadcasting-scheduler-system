[project]
name = "broadcast-scheduler"
version = "0.1.0"
description = "FastAPI backend for the Intelligent Broadcasting Scheduler: pairs packages with the nearest rider and streams scheduler changes over WebSockets."
authors = [
    { name = "Tayyab Mir" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "google-cloud-firestore>=2.31.0",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
broadcast-scheduler = "broadcast_scheduler.main:run"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "firestore: integration tests that need the Firestore emulator (FIRESTORE_EMULATOR_HOST)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]
